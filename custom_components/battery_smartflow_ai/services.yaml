start_debug_recording:
  name: Start debug recording
  description: Start a bounded technical debug recording for one Battery SmartFlow AI config entry.
  fields:
    entry_id:
      required: false
      description: Required only when more than one Battery SmartFlow AI config entry is loaded.
      selector:
        config_entry:
          integration: battery_smartflow_ai
    duration_minutes:
      required: true
      selector:
        select:
          options:
            - "10"
            - "30"
            - "60"
            - "120"

stop_debug_recording:
  name: Stop debug recording
  description: Stop an active debug recording and export its JSON debug package.
  fields:
    entry_id:
      required: false
      description: Required only when more than one Battery SmartFlow AI config entry is loaded.
      selector:
        config_entry:
          integration: battery_smartflow_ai

verify_native_write:
  name: Verify first native Zendure write
  description: Developer-only SF2400AC ZenSDK test. Changes outputLimit by 1 W, verifies a fresh readback, and restores the original value. Disable competing writers first.
  fields:
    entry_id:
      required: false
      description: Required only when more than one Battery SmartFlow AI config entry is loaded.
      selector:
        config_entry:
          integration: battery_smartflow_ai
    confirm:
      required: true
      description: Confirms that Zendure HEMS, Z-HA control, and external writers are disabled for this test.
      selector:
        boolean:

start_regulation_training:
  name: Start passive regulation training
  description: >-
    Record real charge/discharge behavior for a limited time (up to 24 hours).
    This never changes regulation settings or sends experimental commands.
  fields:
    entry_id:
      required: false
      description: Required only when more than one Battery SmartFlow AI config entry is loaded.
      selector:
        config_entry:
          integration: battery_smartflow_ai
    duration_minutes:
      required: true
      description: Select 10, 30, 60, 120 minutes, or 1440 minutes (24 hours).
      selector:
        select:
          options:
            - "10"
            - "30"
            - "60"
            - "120"
            - "1440"
    direction:
      required: false
      default: both
      selector:
        select:
          options:
            - both
            - charge
            - discharge

stop_regulation_training:
  name: Stop passive regulation training
  description: Stop the active training capture and save its observations locally in Home Assistant storage.
  fields:
    entry_id:
      required: false
      description: Required only when more than one Battery SmartFlow AI config entry is loaded.
      selector:
        config_entry:
          integration: battery_smartflow_ai
